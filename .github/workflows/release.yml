name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // "v0.0.0"')
          major=$(echo "$latest" | cut -d. -f1 | tr -d 'v')
          minor=$(echo "$latest" | cut -d. -f2)
          patch=$(echo "$latest" | cut -d. -f3)
          next="v${major}.${minor}.$((patch + 1))"
          echo "latest=$latest next=$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build app debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK with version
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "NotionHealthSync-${{ steps.version.outputs.tag }}.apk"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "NotionHealthSync-$TAG.apk" --clobber
          else
            gh release create "$TAG" "NotionHealthSync-$TAG.apk" \
              --title "$TAG" \
              --target "${{ github.sha }}" \
              --generate-notes
          fi
